<style id="coffee-styles">
  /* Web-only, injected by build-web.mjs from _web-parts/coffee-styles.html.
     Lives in <head> alongside the app's own CSS: a <style> inside the (initially
     hidden) coffee section does not get re-invalidated when :root custom
     properties change, so a live theme toggle left the button on the light brand.
     Scoped under .coffee-view so nothing leaks into the app. Colours are the
     app's own tokens, so light, dark and system themes all follow for free. */
  .coffee-view { max-width: 560px; margin: 0 auto; text-align: center; }
  .coffee-view .cup { position: relative; width: 92px; height: 92px; margin: 0 auto 20px; }
  .coffee-view .cup .steam { position: absolute; top: 2px; left: 0; right: 0; display: flex; justify-content: center; gap: 9px; }
  .coffee-view .cup .steam span { width: 5px; height: 17px; background: var(--line-strong); border-radius: 999px; opacity: .75; animation: coffee-steam 2.4s ease-in-out infinite; }
  .coffee-view .cup .steam span:nth-child(2) { animation-delay: .35s; }
  .coffee-view .cup .steam span:nth-child(3) { animation-delay: .7s; }
  @keyframes coffee-steam { 0%, 100% { transform: translateY(0); opacity: .28; } 50% { transform: translateY(-7px); opacity: .8; } }
  .coffee-view .cup .mug { position: absolute; bottom: 0; left: 12px; right: 12px; height: 52px; background: var(--brand); border-radius: 8px 8px 22px 22px; }
  .coffee-view .cup .mug::before { content: ''; position: absolute; inset: 0 0 auto; height: 9px; background: var(--brand-dark); border-radius: 8px 8px 0 0; }
  .coffee-view .cup .handle { position: absolute; bottom: 14px; right: 0; width: 20px; height: 24px; border: 5px solid var(--brand); border-left: none; border-radius: 0 999px 999px 0; }
  .coffee-view .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; }
  .coffee-view .fund { font-size: 14px; line-height: 1.6; color: var(--muted); margin-bottom: 22px; }
  .coffee-view .coffee-btn { display: inline-flex; align-items: center; gap: 8px; background: var(--brand); color: white; text-decoration: none; font-size: 15px; font-weight: 700; padding: 13px 26px; border-radius: 10px; transition: background .15s ease; }
  .coffee-view .coffee-btn:hover { background: var(--brand-lift); }
  .coffee-view .coffee-btn:focus-visible { outline: 3px solid var(--brand-ring); outline-offset: 2px; }
  .coffee-view .handle-line { margin-top: 22px; font-size: 14px; color: var(--ink-soft); }
  .coffee-view .handle-line a { color: var(--brand-ink); font-weight: 600; }
  .coffee-view .free-note { margin-top: 8px; font-size: 13px; color: var(--faint); }
  @media (prefers-reduced-motion: reduce) { .coffee-view .cup .steam span { animation: none; } }
</style>
